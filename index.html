<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital You — Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --grape:#6B2BD6; --grape-lip:#4B1A9E; --grape-soft:#EFE6FF;
  --sun:#FFC425; --sun-lip:#D99A00; --sun-soft:#FFF4D1; --sun-ink:#8A5E00;
  --tang:#FF8A1E; --tang-lip:#D2660A; --tang-soft:#FFE9D6;
  --mint:#1FC495; --mint-lip:#129A73; --mint-soft:#DBF7EE; --mint-ink:#0C7A5B;
  --coral:#FF4F6D; --coral-lip:#D1314F; --coral-soft:#FFE3E8; --coral-ink:#B8213E;
  --sky:#2FA8F5; --sky-lip:#1B82C4;
  --ink:#2A1948; --muted:#76698F; --line:#E6E0F2; --bg:#FBF9FF; --card:#FFFFFF; --card2:#F7F4FD;
  --locked:#E3DEEC; --locked-lip:#C6BED6; --locked-ink:#A69BBB;
  --head:"Baloo 2", "Nunito", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --grape:#8C55F0; --grape-lip:#5E2DBA; --grape-soft:#2D2050;
    --sun-soft:#3A3014; --sun-ink:#FFD666; --tang-soft:#3A2614; --mint-soft:#11372C; --mint-ink:#5BE3B9; --coral-soft:#3D1A24; --coral-ink:#FF8FA2;
    --ink:#F3EEFF; --muted:#AFA2C8; --line:#3A2E55; --bg:#150E24; --card:#201735; --card2:#281D42;
    --locked:#3A2F52; --locked-lip:#2A2140; --locked-ink:#7D7097;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --grape:#8C55F0; --grape-lip:#5E2DBA; --grape-soft:#2D2050;
  --sun-soft:#3A3014; --sun-ink:#FFD666; --tang-soft:#3A2614; --mint-soft:#11372C; --mint-ink:#5BE3B9; --coral-soft:#3D1A24; --coral-ink:#FF8FA2;
  --ink:#F3EEFF; --muted:#AFA2C8; --line:#3A2E55; --bg:#150E24; --card:#201735; --card2:#281D42;
  --locked:#3A2F52; --locked-lip:#2A2140; --locked-ink:#7D7097;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:700;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0;font-weight:800;letter-spacing:-.01em}
h1{font-size:clamp(2rem,4.6vw,3.4rem)}
h2{font-size:1.65rem}
h3{font-size:1.2rem}
p{margin:0}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:10px}
a{color:var(--sky)}

/* ---------- chunky buttons ---------- */
.btn{--c:var(--grape);--l:var(--grape-lip);--t:#fff;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  background:var(--c);color:var(--t);border-radius:16px;padding:.8rem 1.4rem;min-height:50px;
  font-family:var(--body);font-weight:900;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;
  box-shadow:0 4px 0 var(--l);transition:transform .06s, box-shadow .06s, filter .15s;user-select:none;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--l)}
.btn.full{width:100%}
.btn.sun{--c:var(--sun);--l:var(--sun-lip);--t:#3D2600}
.btn.tang{--c:var(--tang);--l:var(--tang-lip)}
.btn.mint{--c:var(--mint);--l:var(--mint-lip)}
.btn.coral{--c:var(--coral);--l:var(--coral-lip)}
.btn.sky{--c:var(--sky);--l:var(--sky-lip)}
.btn.ghost{--c:var(--card);--l:var(--line);--t:var(--grape);border:2px solid var(--line)}
.btn.small{min-height:40px;padding:.45rem 1rem;font-size:.8rem;border-radius:13px}
.btn[disabled]{--c:var(--locked);--l:var(--locked-lip);--t:var(--locked-ink);cursor:not-allowed;filter:none}
.btn[disabled]:active{transform:none;box-shadow:0 4px 0 var(--l)}
.link{color:var(--grape);font-weight:900;text-transform:none;letter-spacing:0}
.linkbtn{color:var(--sky);font-weight:900;font-size:.9rem;letter-spacing:.05em;text-transform:uppercase;padding:.6rem .4rem}

/* ---------- surfaces ---------- */
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:1.25rem}
.tile{background:var(--card);border:2px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--line);transition:transform .06s, box-shadow .06s, border-color .15s, background .15s;text-align:left}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tile.on{border-color:var(--grape);background:var(--grape-soft);box-shadow:0 4px 0 var(--grape)}
.pill{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;padding:.2rem .7rem;font-size:.8rem;font-weight:900;background:var(--card2);color:var(--muted)}
.pill.mint{background:var(--mint-soft);color:var(--mint-ink)}
.pill.grape{background:var(--grape-soft);color:var(--grape)}
.pill.sun{background:var(--sun-soft);color:var(--sun-ink)}
.pill.coral{background:var(--coral-soft);color:var(--coral-ink)}
.bar{height:16px;border-radius:999px;background:var(--locked);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--mint);position:relative;transition:width .5s cubic-bezier(.3,1.4,.6,1)}
.bar>i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.squircle{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.6rem;flex:none}

/* ---------- speech bubble + mascot ---------- */
.buddy{display:flex;align-items:flex-end;gap:.75rem}
.buddy img{width:84px;flex:none;filter:drop-shadow(0 6px 0 rgba(42,25,72,.08))}
.speech{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:.8rem 1rem;font-weight:800;margin-bottom:2.2rem}
.speech::before{content:"";position:absolute;left:-11px;bottom:18px;width:18px;height:18px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}

/* ---------- public header ---------- */
.pubhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--line)}
body.has-pubhead::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.pubhead .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:1rem;padding:.7rem 1.25rem}
.logo{display:flex;align-items:center;gap:.55rem;font-family:var(--head);font-weight:800;font-size:1.35rem;color:var(--grape);text-decoration:none;white-space:nowrap}
.logo b{flex:none;width:38px;height:38px;border-radius:12px;background:var(--grape);box-shadow:0 3px 0 var(--grape-lip);display:grid;place-items:center;font-size:1.2rem}
.pubnav{display:flex;gap:.25rem;margin-left:auto;align-items:center}
.pubnav button.navl{padding:.5rem .8rem;border-radius:12px;color:var(--muted);font-weight:900}
.pubnav button.navl:hover{background:var(--card2);color:var(--ink)}
.langpill{border:2px solid var(--line);border-radius:12px;padding:.35rem .7rem;font-weight:900;color:var(--muted)}
@media (max-width:640px){.pubnav .navl,.langpill{display:none}}

.wrap{max-width:1180px;margin:0 auto;padding:1.5rem 1.25rem 4rem}
.narrow{max-width:520px;margin:0 auto}

/* ---------- landing ---------- */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:2.5rem;align-items:center;padding:2rem 0 3rem}
.hero h1{color:var(--ink)}
.hero .lede{font-size:1.15rem;color:var(--muted);max-width:30ch;margin:.8rem 0 1.6rem}
.hero-art{position:relative}
.hero-art .frame{border-radius:32px;overflow:hidden;border:4px solid var(--card);box-shadow:0 10px 0 var(--grape-soft);transform:rotate(2deg)}
.hero-art .peek{position:absolute;width:118px;left:-38px;bottom:-26px;transform:rotate(-4deg)}
.hero-art .peek2{position:absolute;width:104px;right:-20px;top:-40px}
.statrow{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.4rem}
.stat{display:flex;align-items:center;gap:.5rem;border:2px solid var(--line);border-radius:14px;padding:.45rem .8rem;background:var(--card)}
.stat strong{font-family:var(--head);font-size:1.2rem}
.stat span{color:var(--muted);font-size:.85rem}
.flags{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.9rem;margin-top:1.2rem}
.flag{display:flex;flex-direction:column;align-items:center;gap:.55rem;padding:1rem .6rem .8rem}
.flag img{width:68px;height:46px;object-fit:cover;border-radius:9px;box-shadow:0 0 0 2px var(--line)}
.flag b{font-weight:900}
.flag small{color:var(--muted);font-size:.8rem;margin-top:-.4rem}
.partners{margin:3rem auto 0;display:flex;flex-direction:column;align-items:center;gap:.6rem;color:var(--muted);font-size:.9rem}
.partners img{width:300px;background:#fff;border-radius:14px;padding:.6rem 1rem}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:3rem;padding-top:1rem}.hero-art{max-width:460px;margin:0 auto}}

/* ---------- catalog / lists ---------- */
.seg{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.2rem 0}
.seg button{border:2px solid var(--line);border-radius:12px;padding:.4rem .9rem;font-weight:900;color:var(--muted);background:var(--card)}
.seg button.on{border-color:var(--grape);color:var(--grape);background:var(--grape-soft)}
.crow{display:flex;align-items:center;gap:1rem;padding:1rem}
.crow + .crow{margin-top:.8rem}
.crow .meta{flex:1;min-width:0}
.crow .meta b{display:block;font-size:1.05rem;line-height:1.3}
.crow .meta small{color:var(--muted);font-size:.88rem}
.crow .right{display:flex;flex-direction:column;align-items:flex-end;gap:.4rem}
@media (max-width:560px){.crow{flex-wrap:wrap}.crow .right{flex-direction:row;width:100%;justify-content:space-between;align-items:center}}

/* ---------- forms / auth ---------- */
.authcard{position:relative;margin-top:4.5rem;padding:2rem 1.5rem 1.6rem}
.authcard .peek{position:absolute;width:96px;top:-86px;right:22px}
.field{display:flex;flex-direction:column;gap:.35rem;margin-bottom:1rem}
.field label{font-weight:900;font-size:.92rem}
.field .hint{font-size:.82rem;color:var(--muted)}
.field .err{font-size:.85rem;color:var(--coral-ink)}
.input{width:100%;border:2px solid var(--line);background:var(--card2);border-radius:14px;padding:.75rem .9rem;font-weight:700;min-height:50px}
.input:focus{outline:none;border-color:var(--sky);background:var(--card)}
.input.bad{border-color:var(--coral)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.or{display:flex;align-items:center;gap:.8rem;color:var(--muted);font-size:.85rem;margin:1.2rem 0}
.or::before,.or::after{content:"";flex:1;height:2px;background:var(--line)}
.note{display:flex;gap:.6rem;align-items:flex-start;background:var(--card2);border-radius:14px;padding:.75rem .9rem;color:var(--muted);font-size:.88rem}

/* ---------- role select ---------- */
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1.5rem}
.role{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.5rem;padding:1.6rem 1rem 1.3rem}
.role .squircle{width:76px;height:76px;font-size:2.4rem;border-radius:24px}
.role b{font-family:var(--head);font-size:1.4rem}
.role small{color:var(--muted)}
@media (max-width:640px){.roles{grid-template-columns:1fr}.role{flex-direction:row;text-align:left;padding:1rem}.role .squircle{width:60px;height:60px;font-size:1.9rem}.role div{display:flex;flex-direction:column}}

/* ---------- step flow (signup, lesson) ---------- */
.flow{min-height:100%;height:100%;display:flex;flex-direction:column}
.flowtop{display:flex;align-items:center;gap:1rem;max-width:1000px;width:100%;margin:0 auto;padding:1.4rem 1.25rem .6rem}
.flowtop .x{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.4rem;color:var(--locked-ink);flex:none}
.flowtop .x:hover{background:var(--card2);color:var(--ink)}
.flowtop .bar{flex:1}
.flowtop .xpcount{font-weight:900;color:var(--sun-ink);white-space:nowrap}
.flowbody{flex:1;overflow:auto;padding:1.5rem 1.25rem 2rem}
.flowbody .inner{max-width:640px;margin:0 auto}
.flowfoot{border-top:2px solid var(--line);background:var(--card)}
.flowfoot .in{max-width:1000px;margin:0 auto;padding:1.2rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:120px}
.flowfoot.good{background:var(--mint-soft);border-color:transparent}
.flowfoot.bad{background:var(--coral-soft);border-color:transparent}
.verdict{display:flex;align-items:center;gap:1rem}
.verdict .ico{width:64px;height:64px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:2rem;flex:none}
.verdict h3{font-size:1.45rem}
.good .verdict h3,.good .verdict p{color:var(--mint-ink)}
.bad .verdict h3,.bad .verdict p{color:var(--coral-ink)}
.verdict p{font-size:.95rem;max-width:52ch}
@media (max-width:640px){.flowfoot .in{flex-direction:column;align-items:stretch}.flowfoot .btn{width:100%}.verdict .ico{display:none}}
.qtitle{font-family:var(--head);font-size:clamp(1.5rem,3.4vw,2rem);font-weight:800;margin-bottom:1.3rem;line-height:1.2}
.opts{display:grid;gap:.75rem}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:.9rem;padding:.95rem 1rem;font-size:1.05rem}
.opt .k{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:.85rem;color:var(--muted);flex:none}
.opt.on .k{border-color:var(--grape);color:var(--grape)}
.opt.right{border-color:var(--mint);background:var(--mint-soft);box-shadow:0 4px 0 var(--mint)}
.opt.wrong{border-color:var(--coral);background:var(--coral-soft);box-shadow:0 4px 0 var(--coral)}
.opt[disabled]{cursor:default}
.big2 .opt{flex-direction:column;justify-content:center;padding:1.6rem 1rem;font-family:var(--head);font-size:1.5rem;text-align:center}
.big2 .opt .k{display:none}
.big2 .opt .em{font-size:2.6rem}
.postmock{border:2px solid var(--line);border-radius:18px;padding:1rem;margin-bottom:1.2rem;background:var(--card)}
.postmock .who{display:flex;gap:.6rem;align-items:center;margin-bottom:.5rem;font-weight:900}
.postmock .av{width:36px;height:36px;border-radius:50%;background:var(--tang-soft);display:grid;place-items:center}
.chips{display:flex;flex-wrap:wrap;gap:.6rem}
.chip{padding:.7rem 1rem;font-weight:900}
.video{position:relative;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,#3A1C78,#6B2BD6 60%,#FF8A1E);display:grid;place-items:center;border:2px solid var(--line)}
.video .play{width:84px;height:84px;border-radius:50%;background:#fff;color:var(--grape);display:grid;place-items:center;font-size:2rem;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.video .vtitle{position:absolute;left:1rem;top:.9rem;right:1rem;color:#fff;font-weight:900;font-size:.95rem}
.video .scrub{position:absolute;left:1rem;right:1rem;bottom:1rem;display:flex;align-items:center;gap:.7rem;color:#fff;font-size:.82rem}
.video .scrub .bar{flex:1;height:8px;background:rgba(255,255,255,.3)}
.video .scrub .bar i{background:#fff}
.video .scrub .bar i::after{display:none}
.video img{position:absolute;right:4%;bottom:0;height:78%;width:auto}
.reading{font-size:1.08rem;line-height:1.65;font-weight:700}
.reading p+p{margin-top:.8rem}
textarea.input{min-height:130px;resize:vertical}

/* end screen */
.endscr{text-align:center;display:flex;flex-direction:column;align-items:center;gap:1rem;padding-top:1rem}
.endscr img{width:150px}
.endscr h1{color:var(--sun-lip);font-size:clamp(2rem,5vw,2.8rem)}
.endstats{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;margin-top:.6rem}
.endstat{border:2px solid var(--c);border-radius:16px;overflow:hidden;min-width:120px;background:var(--card)}
.endstat .t{background:var(--c);color:#fff;font-size:.78rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:.25rem .6rem}
.endstat .v{font-family:var(--head);font-size:1.6rem;padding:.4rem .6rem;color:var(--c)}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr) 360px;min-height:100%}
.side{position:sticky;top:0;height:100vh;border-right:2px solid var(--line);padding:1.4rem 1rem;display:flex;flex-direction:column;gap:.3rem;background:var(--bg)}
.side .logo{padding:.2rem .6rem 1.4rem}
.nav{display:flex;align-items:center;gap:.9rem;padding:.7rem .9rem;border-radius:14px;border:2px solid transparent;font-weight:900;letter-spacing:.04em;text-transform:uppercase;font-size:.9rem;color:var(--muted);text-align:left;width:100%}
.nav .e{font-size:1.5rem;width:32px;text-align:center}
.nav:hover{background:var(--card2)}
.nav.on{border-color:var(--grape);background:var(--grape-soft);color:var(--grape)}
.side .spacer{flex:1}
.main{padding:1.4rem 1.5rem 6rem;min-width:0}
.main .col{max-width:620px;margin:0 auto}
.rail{position:sticky;top:0;height:100vh;overflow:auto;padding:1.4rem 1.5rem 2rem 0;display:flex;flex-direction:column;gap:1.1rem}
.statbar{display:flex;align-items:center;justify-content:space-between;gap:.4rem;padding:.2rem .3rem}
.sb{display:flex;align-items:center;gap:.35rem;font-weight:900;padding:.4rem .6rem;border-radius:12px}
.sb:hover{background:var(--card2)}
.sb .e{font-size:1.35rem}
.sb.fire{color:var(--tang)} .sb.xp{color:var(--sun-lip)} .sb.lvl{color:var(--grape)}
.mtop,.tabbar,.rail-inline{display:none}
.shell.norail{grid-template-columns:250px minmax(0,1fr)}
.shell.norail .main .col{max-width:720px}
@media (max-width:1180px){
  .shell{grid-template-columns:96px minmax(0,1fr)}
  .side .logo span,.nav .t{display:none}
  .side .logo{justify-content:center;padding:.2rem 0 1.4rem}
  .nav{justify-content:center;padding:.7rem}
  .rail{position:static;height:auto;padding:0;overflow:visible;max-width:620px;margin:2rem auto 0}
  .rail .statbar{display:none}
  .rail-side{display:none}
  .shell.norail{grid-template-columns:96px minmax(0,1fr)}
  .rail-inline{display:flex}
}
@media (max-width:760px){
  .shell,.shell.norail{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:0 1rem 7rem}
  .mtop{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);border-bottom:2px solid var(--line);margin:0 -1rem 1rem;padding:.5rem 1rem;justify-content:space-between;align-items:center}
  body.has-mtop::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--bg)}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:2px solid var(--line);justify-content:space-around;padding:.4rem .4rem calc(.4rem + env(safe-area-inset-bottom,0px))}
  .tabbar button{display:flex;flex-direction:column;align-items:center;font-size:.7rem;font-weight:900;color:var(--muted);padding:.3rem .6rem;border-radius:12px;border:2px solid transparent}
  .tabbar button .e{font-size:1.5rem;line-height:1.2}
  .tabbar button.on{color:var(--grape);border-color:var(--grape);background:var(--grape-soft)}
}

/* ---------- learn path ---------- */
.greet{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin:.4rem 0 1rem}
.greet h2{font-size:1.4rem}
.unit{position:relative;border-radius:20px;padding:1.1rem 1.2rem;color:#fff;background:var(--uc,var(--grape));box-shadow:0 5px 0 var(--ul,var(--grape-lip));display:flex;align-items:center;justify-content:space-between;gap:1rem;margin:1.8rem 0 1.4rem}
.unit small{opacity:.85;font-weight:800}
.unit h3{font-size:1.35rem;color:#fff}
.unit .btn{--c:rgba(255,255,255,.18);--l:rgba(0,0,0,.18);border:2px solid rgba(255,255,255,.35)}
.unit.u2{--uc:var(--tang);--ul:var(--tang-lip)}
.unit.u0{--uc:var(--sky);--ul:var(--sky-lip)}
.unit.locked{--uc:var(--locked);--ul:var(--locked-lip);color:var(--locked-ink)}
.unit.locked h3{color:var(--locked-ink)}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:1.35rem;padding:.6rem 0 1rem}
.nodewrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{--c:var(--grape);--l:var(--grape-lip);position:relative;width:76px;height:70px;border-radius:50%;background:var(--c);box-shadow:0 7px 0 var(--l);display:grid;place-items:center;font-size:1.9rem;transition:transform .06s, box-shadow .06s}
.node:active{transform:translateY(6px);box-shadow:0 1px 0 var(--l)}
.node.done{--c:var(--sun);--l:var(--sun-lip)}
.node.locked{--c:var(--locked);--l:var(--locked-lip);filter:grayscale(1);opacity:.85}
.node.locked>span{opacity:.6}
.node.chest{border-radius:22px}
.node.rec{--c:var(--tang);--l:var(--tang-lip)}
.node .chk{position:absolute;right:-4px;top:-4px;width:26px;height:26px;border-radius:50%;background:var(--mint);color:#fff;font-size:.85rem;display:grid;place-items:center;border:3px solid var(--bg);font-weight:900}
.ring{position:absolute;width:100px;height:96px;border-radius:50%;top:-13px;border:7px solid var(--locked);pointer-events:none}
.ring.p{border-color:var(--grape-soft)}
.startbub{position:absolute;bottom:calc(100% + 26px);background:var(--card);border:2px solid var(--line);color:var(--grape);font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:.45rem .9rem;border-radius:14px;white-space:nowrap;animation:bob 1.4s ease-in-out infinite;z-index:2;font-size:.9rem}
.startbub::after{content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:14px;background:var(--card);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.startbub{animation:none}}
.nlabel{margin-top:.75rem;font-size:.8rem;color:var(--muted);font-weight:900;max-width:140px;text-align:center;line-height:1.25}
.pop{position:absolute;top:calc(100% + 14px);left:50%;transform:translateX(calc(-50% - var(--x,0px)));z-index:10;width:300px;max-width:84vw;background:var(--c,var(--grape));color:#fff;border-radius:18px;padding:1rem;box-shadow:0 5px 0 var(--l,var(--grape-lip));text-align:left}
.pop::before{content:"";position:absolute;top:-8px;left:calc(50% + var(--x,0px));width:16px;height:16px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:3px}
.pop b{display:block;font-family:var(--head);font-size:1.2rem;line-height:1.2}
.pop small{display:block;opacity:.9;margin:.2rem 0 .8rem}
.pop .btn{--c:#fff;--l:rgba(0,0,0,.18);--t:var(--pc,var(--grape));width:100%}
.pop.locked{--c:var(--card);--l:var(--line);color:var(--ink);border:2px solid var(--line)}
.pop.locked small{color:var(--muted)}
.pop.locked .btn{--c:var(--locked);--l:var(--locked-lip);--t:var(--locked-ink)}
.pathbuddy{position:absolute;width:118px;pointer-events:none}

/* rail cards */
.rc h3{font-size:1.15rem;margin-bottom:.7rem;display:flex;align-items:center;justify-content:space-between}
.rc h3 .linkbtn{font-size:.78rem;padding:0}
.moods{display:flex;gap:.6rem}
.moods button{flex:1;font-size:1.9rem;padding:.5rem 0;text-align:center}
.lb{display:flex;flex-direction:column;gap:.15rem}
.lbrow{display:flex;align-items:center;gap:.7rem;padding:.45rem .5rem;border-radius:12px}
.lbrow.me{background:var(--grape-soft)}
.lbrow .rk{width:24px;font-weight:900;text-align:center}
.lbrow .rk.g{color:var(--sun-lip)}

.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}

.badge.got{background:var(--sun-soft);border-color:var(--sun);box-shadow:0 3px 0 var(--sun-lip)}
.badge.lock{filter:grayscale(1);opacity:.5}

/* ---------- modal / sheet ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(21,14,36,.55);display:grid;place-items:center;padding:1rem;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--card);border-radius:26px;padding:1.6rem 1.4rem;max-width:420px;width:100%;text-align:center;position:relative;border:2px solid var(--line);max-height:90vh;overflow:auto;animation:pop .25s cubic-bezier(.3,1.5,.6,1)}
.modal.wide{max-width:560px;text-align:left}
@keyframes pop{from{transform:scale(.9);opacity:0}}
@media (prefers-reduced-motion:reduce){.modal,.scrim{animation:none}}
.modal .close{position:absolute;right:.8rem;top:.8rem;width:36px;height:36px;border-radius:10px;color:var(--muted);font-size:1.2rem}
.modal .close:hover{background:var(--card2)}
.modal img.m{width:120px;margin:0 auto .4rem}

/* ---------- AI buddy ---------- */
.fab{position:fixed;right:1.2rem;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));z-index:40;width:62px;height:62px;border-radius:20px;background:var(--grape);box-shadow:0 5px 0 var(--grape-lip);font-size:1.8rem;display:grid;place-items:center}
.fab .new{position:absolute;top:-8px;left:-10px;background:var(--coral);color:#fff;font-size:.65rem;font-weight:900;letter-spacing:.06em;padding:.1rem .45rem;border-radius:8px;box-shadow:0 2px 0 var(--coral-lip)}
@media (max-width:760px){.fab{bottom:calc(5.2rem + env(safe-area-inset-bottom,0px));right:1rem;width:54px;height:54px}}
.chat{position:fixed;right:1.2rem;bottom:calc(5.6rem + env(safe-area-inset-bottom,0px));z-index:41;width:360px;max-width:calc(100vw - 2rem);height:480px;max-height:70vh;background:var(--card);border:2px solid var(--line);border-radius:24px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 6px 0 var(--line)}
@media (max-width:760px){.chat{bottom:calc(9.4rem + env(safe-area-inset-bottom,0px));right:1rem}}
.chat header{display:flex;align-items:center;gap:.6rem;padding:.8rem 1rem;background:var(--grape);color:#fff}
.chat header b{flex:1}
.chat .msgs{flex:1;overflow:auto;padding:1rem;display:flex;flex-direction:column;gap:.6rem}
.msg{max-width:84%;padding:.6rem .85rem;border-radius:16px;font-size:.93rem;line-height:1.4}
.msg.ai{background:var(--card2);border-bottom-left-radius:4px}
.msg.me{background:var(--grape);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chat .sugg{display:flex;gap:.4rem;flex-wrap:wrap;padding:0 1rem .6rem}
.chat .sugg button{border:2px solid var(--line);border-radius:999px;padding:.25rem .7rem;font-size:.8rem;font-weight:900;color:var(--grape)}
.chat form{display:flex;gap:.5rem;padding:.7rem;border-top:2px solid var(--line)}
.chat form .input{min-height:44px;padding:.5rem .8rem}

/* ---------- journey map fab ---------- */
.jfab{position:fixed;left:1.2rem;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:.4rem;background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:14px;padding:.5rem .8rem;font-weight:900;font-size:.85rem;color:var(--muted)}
@media (max-width:760px){.jfab{bottom:calc(5.2rem + env(safe-area-inset-bottom,0px));left:1rem}}
.flowpage .jfab{bottom:calc(9rem + env(safe-area-inset-bottom,0px))}
.jlist{display:grid;gap:1rem;margin-top:1rem}
.jlist h4{margin:0 0 .4rem;font-size:.85rem;color:var(--muted)}
.jlist .row{display:flex;flex-wrap:wrap;gap:.4rem}
.jlist .row button{border:2px solid var(--line);border-radius:10px;padding:.3rem .65rem;font-size:.85rem;font-weight:900;background:var(--card2)}
.jlist .row button:hover{border-color:var(--grape);color:var(--grape)}

/* ---------- forum ---------- */
.prompt{display:flex;gap:.8rem;align-items:center;background:var(--sun-soft);border:2px solid var(--sun);border-radius:18px;padding:.9rem 1rem;margin-bottom:1rem}

.compose{display:flex;gap:.7rem;align-items:center;padding:.8rem}
.compose .input{flex:1}
.post{padding:1rem 1.1rem}

.post .who{display:flex;gap:.7rem;align-items:center;margin-bottom:.6rem}
.post .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:1.2rem;flex:none}
.post .who small{display:block;color:var(--muted);font-size:.82rem;line-height:1.2}
.post .body{font-size:1.02rem}
.post .acts{display:flex;gap:.4rem;margin-top:.8rem;flex-wrap:wrap}
.post .acts button{border-radius:10px;padding:.25rem .6rem;font-weight:900;font-size:.88rem;color:var(--muted);border:2px solid var(--line)}
.post .acts button.on{color:var(--coral-ink);border-color:var(--coral);background:var(--coral-soft)}
.post .acts .rep{margin-left:auto;border:0}
.verified{color:var(--sky);font-weight:900;font-size:.82rem}
.live{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;text-align:center}
.live div{background:var(--card2);border-radius:14px;padding:.6rem .3rem}
.live b{display:block;font-family:var(--head);font-size:1.5rem;line-height:1}
.live small{color:var(--muted);font-size:.78rem}
.guides{display:flex;flex-direction:column;gap:.4rem;font-size:.92rem}

/* ---------- help ---------- */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin:1.2rem 0}
.cats .tile{display:flex;flex-direction:column;align-items:center;gap:.3rem;padding:1rem .5rem;text-align:center;font-weight:900;font-size:.9rem}
.cats .tile span{font-size:1.8rem}

.faq{border-bottom:2px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:1rem;padding:1rem .2rem;font-weight:900}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:1.4rem;line-height:1;color:var(--grape)}
.faq[open] summary::after{content:"–"}
.faq p{padding:0 .2rem 1rem;color:var(--muted)}

/* ---------- results / cert / paths ---------- */
.dial{--p:0;width:190px;height:190px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:conic-gradient(var(--mint) calc(var(--p)*1%),var(--locked) 0)}
.dial div{width:146px;height:146px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center}
.dial b{font-family:var(--head);font-size:3rem;line-height:1}
.band{display:flex;align-items:center;gap:1rem;padding:.85rem 1rem;border-radius:16px;border:2px solid var(--line);background:var(--card)}
.band + .band{margin-top:.6rem}
.band .r{font-family:var(--head);font-weight:800;width:84px;flex:none;color:var(--muted)}
.band.me{border-color:var(--mint);background:var(--mint-soft);box-shadow:0 4px 0 var(--mint)}
.band.me .r{color:var(--mint-ink)}
.cert{position:relative;background:var(--card);border:3px solid var(--sun);border-radius:24px;padding:2.2rem 1.5rem;text-align:center;box-shadow:0 6px 0 var(--sun-lip);overflow:hidden}
.cert::before{content:"";position:absolute;inset:10px;border:2px dashed var(--sun);border-radius:16px;pointer-events:none}
.cert .seal{width:76px;height:76px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-size:2.2rem;margin:0 auto .6rem;box-shadow:0 4px 0 var(--sun-lip)}
.cert .nm{font-family:var(--head);font-size:clamp(2rem,6vw,2.8rem);color:var(--grape);line-height:1.1;margin:.4rem 0}
.paths{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1rem;margin-top:1.4rem}
.pcard{display:flex;flex-direction:column;gap:.5rem;padding:1.2rem 1rem 1rem;position:relative}
.pcard.rec{border-color:var(--tang);box-shadow:0 5px 0 var(--tang)}
.pcard .crown{position:absolute;top:-14px;left:1rem;background:var(--tang);color:#fff;font-size:.75rem;font-weight:900;padding:.15rem .6rem;border-radius:8px;box-shadow:0 2px 0 var(--tang-lip)}
.pcard b{font-family:var(--head);font-size:1.15rem;line-height:1.2;flex:1}
.pcard small{color:var(--muted)}

/* journey overview */
.jrow{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .3rem;padding:.4rem .2rem 1rem}
.jrow .who{width:120px;flex:none;font-family:var(--head);font-size:1.15rem}
.jstep{flex:none;border-radius:14px;padding:.6rem .8rem;font-weight:900;font-size:.85rem;color:#fff;background:var(--c);box-shadow:0 4px 0 var(--l);white-space:nowrap}
.jarrow{color:var(--locked-ink);flex:none;font-weight:900}
.scrollx{overflow-x:auto}

.toast{position:fixed;left:50%;bottom:calc(2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:.7rem 1.1rem;border-radius:14px;font-weight:900;font-size:.92rem;max-width:90vw;text-align:center;animation:pop .2s}
@media (max-width:760px){.toast{bottom:calc(6rem + env(safe-area-inset-bottom,0px))}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
.center{text-align:center}
.stack>*+*{margin-top:1rem}
.row{display:flex;align-items:center;gap:.7rem}
.between{justify-content:space-between}
.wrapgap{flex-wrap:wrap}
.tracker{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin:1.4rem 0}
.tracker div{border-radius:12px;padding:.55rem .4rem;font-size:.8rem;font-weight:900;text-align:center;background:var(--card2);color:var(--muted);border:2px solid var(--line)}
.tracker .ok{background:var(--mint-soft);color:var(--mint-ink);border-color:var(--mint)}
.tracker .now{background:var(--sun-soft);color:var(--sun-ink);border-color:var(--sun)}
@media (max-width:560px){.tracker{grid-template-columns:1fr 1fr}}
.steps3{display:flex;flex-direction:column;gap:.7rem;margin:1rem 0}
.steps3 div{display:flex;gap:.8rem;align-items:flex-start}
.steps3 i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--grape);color:#fff;display:grid;place-items:center;font-weight:900;flex:none;font-size:.9rem}
.envelope{font-size:4rem;width:120px;height:120px;border-radius:36px;background:var(--grape-soft);display:grid;place-items:center;margin:0 auto 1rem}

/* ---------- game layer ---------- */
.logo em{font-style:normal;display:inline-block;background:var(--sun);color:#3D2600;padding:0 .45rem;border-radius:10px;transform:rotate(-5deg);box-shadow:0 3px 0 var(--sun-lip);margin-left:.3rem}
.side{overflow:auto}
.sb.fire.cold{filter:grayscale(1);opacity:.55}
.sb.gem{color:var(--sky)}
.nav{position:relative}
.nav .dot{position:absolute;left:40px;top:8px;width:13px;height:13px;border-radius:50%;background:var(--coral);border:2px solid var(--bg)}
.nrstats{display:flex;justify-content:flex-end;margin-bottom:.4rem}
@media (max-width:760px){.nrstats{display:none}}
.bwrap{position:relative;display:inline-block;container-type:inline-size;line-height:0}
.bwrap img{width:100%;height:auto;display:block}
.hat{position:absolute;left:50%;top:-9%;transform:translateX(-50%);font-size:40cqw;line-height:1;pointer-events:none}
.hat-phones{font-size:46cqw}
.hat-flower{font-size:26cqw}
.hat-crown{font-size:38cqw}
.bwrap.pathbuddy{position:absolute;width:118px;pointer-events:none;animation:floaty 3.2s ease-in-out infinite}
@media (max-width:560px){.bwrap.pathbuddy{width:84px}}
.vbuddy{flex:none}
.endbuddy{width:140px}
.mbuddy{width:100px;margin:0 auto .5rem}
.profbuddy{width:96px;flex:none}
.jump{animation:jump .65s cubic-bezier(.3,1.6,.5,1)}
.shake{animation:shake .45s}
@keyframes jump{0%{transform:translateY(0)}30%{transform:translateY(4px) scale(1.06,.92)}60%{transform:translateY(-18px) scale(.96,1.05)}100%{transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-4deg)}40%{transform:translateX(7px) rotate(4deg)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.1);opacity:.45}}
@keyframes chestshake{0%,78%,100%{transform:rotate(0)}82%{transform:rotate(-9deg)}86%{transform:rotate(9deg)}90%{transform:rotate(-6deg)}94%{transform:rotate(4deg)}}
@keyframes xpup{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}20%{opacity:1;transform:translate(-50%,0) scale(1.2)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
@keyframes popin{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.ring.p{animation:pulse 1.8s ease-in-out infinite}

.treasure{width:86px;height:74px;border-radius:24px;font-size:2.4rem;display:grid;place-items:center;background:var(--locked);box-shadow:0 7px 0 var(--locked-lip);transition:transform .06s, box-shadow .06s}
.treasure:active{transform:translateY(6px);box-shadow:0 1px 0 var(--locked-lip)}
.treasure.locked{filter:grayscale(1);opacity:.7}
.treasure.ready{background:var(--sun);box-shadow:0 7px 0 var(--sun-lip);animation:chestshake 1.8s infinite}
.treasure.open{background:var(--card2);box-shadow:0 7px 0 var(--line)}
.xpfloat{position:fixed;z-index:95;font-family:var(--head);font-weight:800;font-size:1.7rem;pointer-events:none;animation:xpup 1.05s ease-out forwards;white-space:nowrap}
.combo{display:inline-flex;align-items:center;gap:.2rem;background:var(--tang);color:#fff;border-radius:12px;padding:.15rem .6rem;font-weight:900;box-shadow:0 3px 0 var(--tang-lip);animation:popin .35s;white-space:nowrap}
.quest{display:flex;align-items:center;gap:.8rem;padding:.85rem 0}
.quest+.quest{border-top:2px solid var(--line)}
.quest .qe{font-size:1.9rem;width:46px;text-align:center;flex:none}
.quest.compact .qe{font-size:1.4rem;width:30px}
.quest .qb{flex:1;min-width:0}
.quest b{display:block;font-size:.95rem;margin-bottom:.3rem;line-height:1.25}
.qbar{position:relative;height:20px;border-radius:999px;background:var(--locked);overflow:hidden}
.qbar i{position:absolute;inset:0 auto 0 0;background:var(--sun);border-radius:999px;transition:width .5s}
.qbar span{position:relative;display:block;text-align:center;font-size:.75rem;font-weight:900;line-height:20px;color:var(--ink)}
.qchest{font-size:1.7rem;filter:grayscale(1);opacity:.45;width:44px;text-align:center;flex:none}
.qchest.ready{filter:none;opacity:1;animation:chestshake 1.6s infinite}
.qchest.done{filter:none;opacity:1;font-size:1.3rem}
.lbsep{text-align:center;color:var(--muted);letter-spacing:.2em;font-size:.8rem}
.badge .blv{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;border-radius:50%;background:var(--grape);color:#fff;font-size:.7rem;font-weight:900;display:grid;place-items:center;border:2px solid var(--card)}
.badge.lock .blv{background:var(--locked-ink)}
.badge.lock{filter:grayscale(1);opacity:.55}
.greet{flex-wrap:wrap}
.bigflame{font-size:5rem;line-height:1;display:inline-block;animation:jump .7s}
.bigflame.cold{filter:grayscale(1)}
.scal{display:grid;grid-template-columns:repeat(7,1fr);gap:.35rem;margin:1.2rem 0}
.sday{display:flex;flex-direction:column;align-items:center;gap:.25rem}
.sday small{color:var(--muted);font-weight:900}
.sday span{width:38px;height:38px;border-radius:50%;background:var(--locked);display:grid;place-items:center;font-size:1.1rem}
.sday.lit span{background:var(--tang-soft);box-shadow:0 0 0 2px var(--tang)}
.sday.today small{color:var(--tang)}
.giftbox{font-size:4.5rem;line-height:1.1;display:inline-block;animation:popin .5s}
.gemwin{font-family:var(--head);font-size:2.4rem;font-weight:800;color:var(--sky);margin:.2rem 0}
.gembal{font-family:var(--head);font-size:1.3rem;font-weight:800;color:var(--sky);border:2px solid var(--line);border-radius:14px;padding:.2rem .8rem;background:var(--card)}
.sh{margin:1.7rem 0 .8rem}
.shopitem{display:flex;align-items:center;gap:1rem;padding:.9rem 0;flex-wrap:wrap}
.shopitem+.shopitem{border-top:2px solid var(--line)}
.shopitem .sicon{font-size:2rem;width:56px;height:56px;border-radius:16px;background:var(--card2);display:grid;place-items:center;flex:none}
.shopitem .meta{flex:1;min-width:150px}
.shopitem .meta b{display:block}
.shopitem .meta small{color:var(--muted)}
.shopitem .acts{display:flex;gap:.5rem;align-items:center}
.buddypick{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.buddypick .tile{display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:1rem}
.bwrap.pick{width:64px}
.hats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.9rem}
.hatcard{display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:1.2rem .6rem 1rem;text-align:center}
.bwrap.prev{width:58px;margin-top:.6rem}
.toggle{width:56px;height:32px;border-radius:999px;background:var(--locked);position:relative;transition:background .2s;flex:none}
.toggle i{position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.toggle.on{background:var(--mint)}
.toggle.on i{left:28px}
.profhead{display:flex;gap:1.4rem;align-items:center;background:var(--grape-soft);border-radius:24px;padding:1.4rem;margin-top:.4rem}
.pstats{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem}
.pst{display:grid;grid-template-columns:auto 1fr;column-gap:.8rem;align-items:center;border:2px solid var(--line);border-radius:18px;padding:.8rem 1rem;background:var(--card)}
.pst span{grid-row:span 2;font-size:1.8rem}
.pst b{font-family:var(--head);font-size:1.45rem;line-height:1}
.pst small{color:var(--muted)}
.ach{display:flex;gap:1rem;align-items:center;padding:.9rem 0}
.ach+.ach{border-top:2px solid var(--line)}
.ach .meta{flex:1;min-width:0}
.ach .meta b{display:block}
.ach .meta small{color:var(--muted)}
.achic{position:relative;width:68px;height:76px;border-radius:18px;background:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.22);display:grid;place-items:center;font-size:2rem;flex:none;padding-bottom:14px}
.achic.l0{filter:grayscale(1);opacity:.55}
.achic span{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:.65rem;font-weight:900;color:#fff;background:rgba(0,0,0,.25);border-radius:6px;padding:0 .35rem;white-space:nowrap}
.lhead{text-align:center;margin:.4rem 0 1.2rem}
.ltiers{display:flex;justify-content:center;align-items:center;gap:.5rem;margin-bottom:.8rem;flex-wrap:wrap}
.ltier{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:1.6rem;background:var(--card2);border:2px solid var(--line)}
.ltier.past{opacity:.6}
.ltier.next{filter:grayscale(1);opacity:.4}
.ltier.on{width:74px;height:74px;font-size:2.5rem;background:var(--coral-soft);border-color:var(--coral);box-shadow:0 5px 0 var(--coral)}
.lrow{display:flex;align-items:center;gap:.8rem;padding:.65rem .7rem;border-radius:14px;border:2px solid transparent}
.lrow.me{background:var(--grape-soft);border-color:var(--grape)}
.lrow .rk{width:32px;text-align:center;font-weight:900}
.lrow .rk.top{font-size:1.5rem}
.lrow .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;flex:none}
.lrow .nm{flex:1;font-weight:900;min-width:0}
.lrow .px{color:var(--muted);white-space:nowrap}
.zone{text-align:center;font-size:.8rem;font-weight:900;padding:.4rem;margin:.35rem 0;border-radius:10px}
.zone.up{color:var(--mint-ink);background:var(--mint-soft)}
.zone.down{color:var(--coral-ink);background:var(--coral-soft)}
.qhero{display:flex;align-items:center;justify-content:space-between;gap:1rem;background:var(--sun);color:#3D2600;border-radius:24px;padding:1.3rem 1.4rem;box-shadow:0 6px 0 var(--sun-lip);margin:.4rem 0 1.4rem;overflow:hidden}
.qhero h2{color:#3D2600}
.bwrap.qbuddy{width:78px;flex:none;margin-bottom:-2.6rem}
.mbadge{width:72px;height:72px;border-radius:20px;background:var(--grape);display:grid;place-items:center;font-size:2.2rem;box-shadow:0 4px 0 var(--grape-lip);flex:none}
.sticker{position:absolute;z-index:2;font-size:2rem;width:62px;height:62px;border-radius:20px;display:grid;place-items:center;background:var(--card);border:3px solid var(--line);box-shadow:0 5px 0 var(--line);animation:floaty 3.4s ease-in-out infinite}
.sticker small{position:absolute;bottom:-12px;font-size:.68rem;font-weight:900;background:var(--tang);color:#fff;padding:0 .4rem;border-radius:6px;white-space:nowrap;line-height:1.5}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:1.3rem;margin:0 0 3.2rem}
.howc{border-radius:24px;padding:1.4rem;color:#fff;background:var(--c);box-shadow:0 6px 0 var(--l)}
.howc:nth-child(1){transform:rotate(-1.5deg)}
.howc:nth-child(3){transform:rotate(1.5deg)}
.howc .e{font-size:2.4rem;line-height:1}
.howc h3{color:inherit;margin:.5rem 0 .25rem;font-size:1.35rem}
.howc p{opacity:.95;font-size:.95rem}
@media (max-width:760px){.how{grid-template-columns:1fr}}

.sb{white-space:nowrap;padding:.4rem .45rem}
.nodewrap:has(.startbub){margin-top:3.2rem}
.vbuddy{width:74px;margin-top:-64px}
@media (max-width:640px){.vbuddy{display:none}}
.mbuddy{display:block}
.hat{top:-5%}
.hat-cap{top:-4%}
.hat-crown{top:-6%}
.hat-phones{top:3%}
.hat-flower{left:63%;top:3%}
.bwrap.pick{width:84px}
.bwrap.prev{width:70px}
.hats{grid-template-columns:repeat(auto-fill,minmax(108px,1fr))}
@media (prefers-reduced-motion:reduce){.sticker,.bwrap.pathbuddy,.ring.p,.qchest.ready,.treasure.ready,.jump,.shake,.bigflame,.giftbox,.combo{animation:none!important}}
</style>
</head>

function aiReply(q){
  q=q.toLowerCase();
  if(/fake|news|misinfo|true|source/.test(q)) return 'Try the three quick checks from Lesson 3: who posted it (source), when it’s from (date), and whether trusted sites say the same (cross-reference).';
  if(/stress|sad|anxious|bad|worse|scared|help/.test(q)) return 'Thanks for telling me. Taking a break is always okay. If something online is upsetting you, please talk to a trusted adult or use the Help page to reach our team.';
  if(/next|module|path|recommend/.test(q)) return S.postDone ? `Based on your post-assessment, I’d start with Practical Module 2: ${MODULES[1].t}.` : `You’re on Lesson ${Math.min(S.lessonsDone+1,6)} of the Foundational course. Finish it and the post-assessment to unlock practical modules.`;
  return 'Good question! In the live version I’ll answer this using your course material. For now, try asking about fake news, feeling stressed, or what to learn next.';
}

/* ------------------------------------------------ learn path */
function nodeState(kind,i){
  if(kind==='pre') return S.preDone?'done':'current';
  if(kind==='lesson') return i<S.lessonsDone?'done':(S.preDone&&i===S.lessonsDone)?'current':'locked';
  if(kind==='post') return S.postDone?'done':(S.lessonsDone>=6?'current':'locked');
  if(kind==='cert') return S.cert?'done':(S.postDone?'current':'locked');
  if(kind==='mod') return S.postDone ? (i===1?'rec':'open') : 'locked';
}
const OFF = [0,52,78,52,0,-52,-78,-52];
function node(id,kind,i,emoji,label,k){
  const st = nodeState(kind,i), x = OFF[k%OFF.length];
  const cls = st==='done'?'done':st==='locked'?'locked':st==='rec'?'rec':'cur';
  const isChest = kind==='post'||kind==='cert';
  let pop='';
  if(S.pop===id){
    const info = {
      pre:['Pre-assessment','10 questions, about 5 minutes. No wrong answers.'],
      lesson:[LESSONS[i]?.t,`Lesson ${i+1} of 6, ${LESSONS[i]?.m}. Up to +30 XP`],
      post:['Post-assessment','12 questions, about 6 minutes. Your score picks your next module.'],
      cert:['Your certificate','Celebrate finishing the Foundational course!'],
      mod:[MODULES[i]?.t,`Practical module ${i+1}, ${MODULES[i]?.m}`]
    }[kind];
    if(st==='locked'){
      const why = kind==='lesson'?(S.preDone?`Finish lesson ${i} to unlock this.`:'Complete the pre-assessment first.'):kind==='post'?'Finish all 6 lessons to unlock this.':kind==='cert'?'Pass the post-assessment to earn it.':'Finish the Foundational course and post-assessment first.';
      pop=`<div class="pop locked"><b>${info[0]}</b><small>${why}</small><button class="btn small" disabled>Locked</button></div>`;
    } else {
      const label2 = st==='done'?(kind==='cert'?'View certificate':'Practise again'):kind==='pre'||kind==='post'?'Start assessment':kind==='cert'?'Claim certificate':kind==='mod'?(st==='rec'?'Start module':'Explore'):(S.potion?'Start, 2× XP':'Start');
      const c = kind==='mod'?MOD_COLORS[i]:st==='done'?['var(--sun)','var(--sun-lip)']:['var(--grape)','var(--grape-lip)'];
      pop=`<div class="pop" style="--c:${c[0]};--l:${c[1]};--pc:${c[0]}"><b>${info[0]}</b><small>${info[1]}</small><button class="btn small" data-act="open" data-arg="${kind}:${i}">${label2}</button></div>`;
    }
  }
  const style = kind==='mod' && st!=='locked' ? `--c:${MOD_COLORS[i][0]};--l:${MOD_COLORS[i][1]}` : '';
  return `<div class="nodewrap" style="--x:${x}px;transform:translateX(${x}px);${S.pop===id?'z-index:12':''}">
    ${(st==='current'||st==='rec')&&S.pop!==id?`<div class="startbub">${kind==='lesson'&&i===S.lessonsDone&&S.lessonsDone>0?'Continue':'Start'}</div>`:''}
    ${st==='current'?'<span class="ring p"></span>':''}
    <button class="node ${cls} ${isChest?'chest':''}" style="${style}" data-act="pop" data-arg="${id}" aria-label="${label}, ${st==='rec'?'recommended':st}"><span>${st==='locked'&&!isChest?'🔒':emoji}</span>${st==='done'?'<span class="chk">✓</span>':''}</button>
    <span class="nlabel">${label}</span>${pop}</div>`;
}
function chestState(id){ if(S.chests[id]) return 'open'; if(id==='c1') return S.lessonsDone>=3?'ready':'locked'; return S.cert?'ready':'locked'; }
function chestNode(id,k){
  const st=chestState(id), x=OFF[k%OFF.length];
  return `<div class="nodewrap" style="--x:${x}px;transform:translateX(${x}px)"><button class="treasure ${st}" data-act="chest" data-arg="${id}" aria-label="Treasure chest, ${st}">${st==='open'?'📭':'🎁'}</button><span class="nlabel">${st==='ready'?'Tap to open!':st==='open'?'Opened':'Treasure'}</span></div>`;
}

/* ------------------------------------------------ player */
function startPlay(kind, idx){
  const qs = kind==='lesson' ? Q[idx] : ASSESS;
  S.play = {kind, idx, qs, q: kind==='lesson'?0:-1, sel:[], checked:false, right:0, graded:0, text:'', combo:0, best:0};
  go('lesson');
}
function finishPlay(){
  const P=S.play; if(P.rewarded) return; P.rewarded=true;
  if(P.kind==='lesson'){
    P.perfect = P.graded>0 && P.right===P.graded;
    let xp = 10 + P.right*5; if(S.potion){ xp*=2; P.doubled=true; S.potion=0; }
    P.xpEarned=xp; P.gemsEarned = 5 + (P.perfect?5:0);
    S.gems+=P.gemsEarned; addXP(xp);
    if(P.idx===S.lessonsDone) S.lessonsDone++;
  } else {
    P.xpEarned=10; addXP(10);
    if(P.kind==='pre') S.preDone=true;
    if(P.kind==='post') S.postDone=true;
  }
  if(!S.didToday){ S.streak++; S.didToday=true; P.streakUp=true; }
  sfx('level'); setTimeout(confetti,120);
}

    </div></div><div class="flowfoot"><div class="in"><span></span><button class="btn" data-act="pdone">${P.kind==='pre'?'See my path':'See my results'}</button></div></div></div>`;
  }
  const q = P.qs[P.q], pct = Math.round(P.q/total*100);
  let body='', foot='', footCls='';

    body = `${buddy(P.idx%2?'orange':'yellow',q.say)}<button class="video" data-act="playvid" aria-label="Play video: ${q.title}" style="width:100%"><span class="vtitle">▶ ${q.title}</span><img src="${A.yellow}" alt=""><span class="play" aria-hidden="true">▶</span><div class="scrub"><span>0:00</span><div class="bar"><i id="vbar" style="width:${P.watched?100:0}%"></i></div><span>${q.dur}</span></div></button>`;
    foot = `<span class="muted" style="font-size:.9rem">${P.watched?'Nice, you watched it all.':'Tap play to watch.'}</span><button class="btn" data-act="pnext" ${P.watched?'':'disabled'}>Continue</button>`;
  } else if(q.type==='read'){
    body = `<p class="pill grape" style="margin-bottom:.8rem">📖 Reading</p><h2 style="margin-bottom:1rem">${q.title}</h2><div class="reading">${q.body.map(p=>`<p>${p}</p>`).join('')}</div>`;
    foot = `<span></span><button class="btn" data-act="pnext">Continue</button>`;
  } else if(q.type==='reflect'){
    body = `${buddy('yellow','Last step! Write one thing you’ll try. Only you can see this.')}<div class="qtitle">${q.q}</div>

  } else {
    const multi = q.type==='multi', truth = q.type==='truth', poll = q.type==='poll';

      ${prev?`<div class="postmock"><div class="who"><span class="av">📰</span>${prev.who}</div><p>${prev.txt}</p></div>`:''}
      <div class="qtitle">${q.q}</div>${optTiles(truth?['Fact','Myth']:q.o, truth)}`;
    if(P.checked && !poll){
      const ok = P.ok; footCls = ok?'good':'bad';
      const title = ok ? (P.combo>=2?`${P.combo} in a row! 🔥`:['Nice!','Spot on!','You got it!'][P.q%3]) : 'Not quite';
      foot = `<div class="verdict">${buddyImg(S.buddy, 'vbuddy '+(ok?'jump':'shake'))}<div><h3>${title}</h3><p>${q.ex}</p></div></div><button class="btn ${ok?'mint':'coral'}" data-act="pnext">Continue</button>`;
    } else {
      foot = `<button class="btn ghost" data-act="pskip">Skip</button><button class="btn ${poll?'':'mint'}" data-act="${poll?'pnext':'check'}" ${P.sel.length?'':'disabled'}>${poll?'Continue':'Check'}</button>`;
    }
  }
  const hud = P.kind==='lesson' ? `${S.potion?'<span class="pill grape">2× XP</span>':''}${P.combo>=2?`<span class="combo">🔥 ${P.combo}</span>`:''}<span class="xpcount">⚡ ${P.right*5}</span>` : '';
  return `<div class="flow"><div class="flowtop"><button class="x" data-act="quit" aria-label="Quit">✕</button><div class="bar" role="progressbar" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div>${hud}</div>
    <div class="flowbody"><div class="inner">${body}</div></div>
    <div class="flowfoot ${footCls}"><div class="in">${foot}</div></div></div>`;
}

let AC=null;
function sfx(t){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const seq = {good:[[660,.08],[990,.16]], bad:[[260,.12],[196,.22]], chest:[[523,.07],[659,.07],[784,.07],[1047,.22]], level:[[523,.08],[659,.08],[784,.08],[1047,.08],[1319,.32]], tap:[[880,.05]], coin:[[988,.06],[1319,.18]]}[t]||[];
    let at=AC.currentTime;
    seq.forEach(([f,d])=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,at); g.gain.exponentialRampToValueAtTime(.16,at+.01); g.gain.exponentialRampToValueAtTime(.0001,at+d);
      o.connect(g).connect(AC.destination); o.start(at); o.stop(at+d+.02); at+=d*.85; });
  }catch(e){}
}

}

function animateDial(){
  const d=$('#dial'), n=$('#dialn'); if(!d) return;
  if(reduce){ d.style.setProperty('--p',S.score); n.textContent=S.score+'%'; return; }
  let t0=null; const step=t=>{ t0=t0||t; const k=Math.min(1,(t-t0)/1100), e=1-Math.pow(1-k,3), v=Math.round(S.score*e);
    d.style.setProperty('--p',v); n.textContent=v+'%'; if(k<1) requestAnimationFrame(step); else confetti(); };
  requestAnimationFrame(step);
}

/* ------------------------------------------------ confetti */
function confetti(){
  if(reduce) return;
  const c=$('#confetti'), x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#6B2BD6','#FFC425','#FF8A1E','#1FC495','#FF4F6D','#2FA8F5'];
  const ps=Array.from({length:140},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[Math.random()*6|0],a:Math.random()*6,s:(Math.random()-.5)*.3}));
  let f=0; (function tick(){ x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{ p.vy+=.45; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.s; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore(); });
    if(++f<110) requestAnimationFrame(tick); else x.clearRect(0,0,c.width,c.height); })();
}

    if(a==='reset'){ S.journey=false; Object.assign(S, clone(DEMO)); S.loggedIn=false; S.play=null; go('home'); toast('Prototype reset'); return; }
    if(['quests','league','shop','profile','gstreak','gchest','glevel'].includes(a)){
      S.journey=false; S.loggedIn=true; S.pop=null;
      if(a==='gstreak'){ S.modal='streak'; go('learn'); render(); return; }
      if(a==='gchest'){ S.preDone=true; S.lessonsDone=Math.max(S.lessonsDone,3); delete S.chests.c1; go('learn'); render(); setTimeout(()=>ACT.chest('c1'),60); return; }
      if(a==='glevel'){ S.xp=level()*250; S.gems+=20; S.modal='level'; go('learn'); render(); setTimeout(()=>{ sfx('level'); confetti(); },150); return; }
      go(a); return;
    }
    _jump(a);
  }
});

document.addEventListener('click', e=>{
  if(S.pop && !e.target.closest('.nodewrap')){ S.pop=null; if(!e.target.closest('[data-act],[data-go]')) { render(); return; } }
  const stop = e.target.closest('[data-stop]');
  const el = e.target.closest('[data-act],[data-go]');
  if(!el) return;
  if(stop && !stop.contains(el)) return;
  if(el.classList.contains('scrim') && e.target!==el) return;
  // close node popovers when tapping elsewhere handled by pop toggle
  if(el.dataset.act){ e.preventDefault(); ACT[el.dataset.act]?.(el.dataset.arg); }
  if(el.dataset.go){ e.preventDefault(); go(el.dataset.go); }
});
document.addEventListener('submit', e=>{
  const f=e.target.dataset.form; if(!f) return; e.preventDefault();
  const fd=new FormData(e.target);
  if(f==='chat'){ const q=(fd.get('q')||'').trim(); if(q) ACT.ask(q); }
  if(f==='post'){ const t=(fd.get('t')||'').trim(); if(!t) return; (S.posts[S.role]=S.posts[S.role]||[]).unshift({av:R().icon,bg:'var(--grape-soft)',name:R().user||'you',sub:'Just now',txt:t,h:0,c:0}); S.postsCount++; addXP(2); render(); toast('Posted! +2 XP'); sfx('coin'); }
  if(f==='help'){ S.helpQ=fd.get('q')||''; render(); }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ if(S.modal){S.modal=null;render();} else if(S.journey){S.journey=false;render();} else if(S.previewCourse!=null){S.previewCourse=null;render();} else if(S.welcome){S.welcome=false;render();} else if(S.pop){S.pop=null;render();} return; }
  if(location.hash!=='#lesson' || !S.play) return;
  if(/INPUT|TEXTAREA/.test(document.activeElement?.tagName)) return;
  const P=S.play, q=P.qs[P.q];
  if(q && /^[1-4]$/.test(e.key) && ['choice','multi','truth','poll'].includes(q.type)){ const j=+e.key-1; const n=q.type==='truth'?2:q.o.length; if(j<n) ACT.sel(j); }
  if(e.key==='Enter'){ const b=$('.flowfoot .btn:last-child'); if(b && !b.disabled){ e.preventDefault(); b.click(); } }
});
render();
</script>
</body>
</html>
